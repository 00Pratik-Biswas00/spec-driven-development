description = "Create or update the ADK agent development constitution from interactive or provided principle inputs, ensuring all dependent templates stay in sync."

prompt = """
---
description: Create or update the ADK agent development constitution from interactive or provided principle inputs, ensuring all dependent templates stay in sync.
handoffs: 
  - label: Build Agent Specification
    agent: speckit.specify
    prompt: Implement the agent specification based on the updated ADK constitution. I want to build...
---

## User Input

```text
$ARGUMENTS
```

You **MUST** consider the user input before proceeding (if not empty).

## Outline

You are updating the ADK agent development constitution at `.specify/memory/constitution.md`. This file is a TEMPLATE containing placeholder tokens in square brackets (e.g. `[PROJECT_NAME]`, `[PRINCIPLE_1_NAME]`). Your job is to (a) collect/derive concrete values, (b) fill the template precisely with ADK-focused principles, and (c) propagate any amendments across dependent artifacts.

Follow this execution flow:

1. Load the existing ADK constitution template at `.specify/memory/constitution.md`.
   - Identify every placeholder token of the form `[ALL_CAPS_IDENTIFIER]`.
   **IMPORTANT**: The user might require less or more principles than the ones used in the template. If a number is specified, respect that - follow the general template. You will update the doc accordingly.
   **ADK FOCUS**: Ensure principles align with ADK best practices (agent-first design, tool-centric functionality, state-driven orchestration, observability).

2. Collect/derive values for placeholders:
   - If user input (conversation) supplies a value, use it.
   - Otherwise infer from existing repo context (README, docs, prior constitution versions if embedded).
   - For governance dates: `RATIFICATION_DATE` is the original adoption date (if unknown ask or mark TODO), `LAST_AMENDED_DATE` is today if changes are made, otherwise keep previous.
   - `CONSTITUTION_VERSION` must increment according to semantic versioning rules:
     - MAJOR: Backward incompatible governance/principle removals or redefinitions.
     - MINOR: New principle/section added or materially expanded guidance.
     - PATCH: Clarifications, wording, typo fixes, non-semantic refinements.
   - If version bump type ambiguous, propose reasoning before finalizing.

3. Draft the updated ADK constitution content:
   - Replace every placeholder with concrete text (no bracketed tokens left except intentionally retained template slots that the project has chosen not to define yet—explicitly justify any left).
   - Preserve heading hierarchy and comments can be removed once replaced unless they still add clarifying guidance.
   - Ensure each Principle section: succinct name line, paragraph (or bullet list) capturing non‑negotiable rules, explicit rationale if not obvious.
   - **ADK-Specific Principles to Include**:
     - Agent-First Design (modularity, single responsibility)
     - Tool-Centric Functionality (encapsulation, documentation)
     - State-Driven Orchestration (explicit state, traceability)
     - Test-Driven Agent Development (evaluation-first approach)
     - Observability by Design (OpenTelemetry, structured logging)
     - Model Selection Justification (flash vs pro, cost vs capability)
     - Error Handling Strategy (graceful degradation, user-friendly messages)
   - Ensure Governance section lists amendment procedure, versioning policy, and compliance review expectations.

4. ADK-specific consistency propagation checklist (convert prior checklist into active validations):
   - Read `.specify/templates/plan-template.md` and ensure "ADK Technical Context" and "Constitution Check" align with updated principles.
   - Read `.specify/templates/spec-template.md` for agent capabilities/requirements alignment—update if constitution adds/removes mandatory sections or constraints.
   - Read `.specify/templates/tasks-template.md` and ensure task categorization reflects ADK principle-driven task types (agent creation, tool implementation, prompt engineering, evaluation, observability).
   - Read each command file in `.gemini/commands/*.toml` to verify ADK-specific references are consistent.
   - Read any runtime guidance docs (e.g., `README.md`, `docs/quickstart.md`, or `ADK_DEVELOPMENT_GUIDANCE.md` if present). Update references to principles changed.

5. Produce a Sync Impact Report (prepend as an HTML comment at top of the constitution file after update):
   - Version change: old → new
   - List of modified principles (old title → new title if renamed)
   - Added sections
   - Removed sections
   - Templates requiring updates (✅ updated / ⚠ pending) with file paths
   - Follow-up TODOs if any placeholders intentionally deferred.

6. Validation before final output:
   - No remaining unexplained bracket tokens.
   - Version line matches report.
   - Dates ISO format YYYY-MM-DD.
   - Principles are declarative, testable, and free of vague language ("should" → replace with MUST/SHOULD rationale where appropriate).
   - **ADK Validation**: Ensure principles align with ADK best practices and don't contradict ADK framework design.

7. Write the completed constitution back to `.specify/memory/constitution.md` (overwrite).

8. Output a final summary to the user with:
   - New version and bump rationale.
   - Any files flagged for manual follow-up.
   - Suggested commit message (e.g., `docs: amend ADK constitution to vX.Y.Z (agent-first principles + observability requirements)`).

Formatting & Style Requirements:

- Use Markdown headings exactly as in the template (do not demote/promote levels).
- Wrap long rationale lines to keep readability (<100 chars ideally) but do not hard enforce with awkward breaks.
- Keep a single blank line between sections.
- Avoid trailing whitespace.

If the user supplies partial updates (e.g., only one principle revision), still perform validation and version decision steps.

If critical info missing (e.g., ratification date truly unknown), insert `TODO(<FIELD_NAME>): explanation` and include in the Sync Impact Report under deferred items.

Do not create a new template; always operate on the existing `.specify/memory/constitution.md` file.

## ADK Constitution Principle Examples

**Agent-First Design**:
- Every feature must be conceived as an agent or multi-agent system
- Agents must be modular and independently testable
- Single responsibility: each agent has one clear purpose

**Tool-Centric Functionality**:
- All external interactions must be encapsulated in tools
- Tools must have descriptive docstrings (LLM reads these!)
- Tools must be self-contained and independently testable

**State-Driven Orchestration**:
- Agents communicate through explicit, shared state
- State keys must be unique and descriptive
- State changes should be intentional and traceable

**Observability by Design**:
- All agents must integrate with OpenTelemetry tracing
- Structured logging for agent decisions and tool calls
- Metrics tracking for performance and cost
"""
