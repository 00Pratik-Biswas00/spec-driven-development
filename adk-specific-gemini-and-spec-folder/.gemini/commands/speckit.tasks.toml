description = "Generate an actionable, dependency-ordered tasks.md for the ADK agent feature based on available design artifacts."

prompt = """
---
description: Generate an actionable, dependency-ordered tasks.md for the ADK agent feature based on available design artifacts.
handoffs: 
  - label: Analyze For Consistency
    agent: speckit.analyze
    prompt: Run a project analysis for ADK agent consistency
    send: true
  - label: Implement ADK Agent
    agent: speckit.implement
    prompt: Start the ADK agent implementation in phases
    send: true
---

## User Input

```text
$ARGUMENTS
```

You **MUST** consider the user input before proceeding (if not empty).

## Outline

1. **Setup**: Run `.specify/scripts/bash/check-prerequisites.sh --json` from repo root and parse FEATURE_DIR and AVAILABLE_DOCS list. All paths must be absolute. For single quotes in args like "I'm Groot", use escape syntax: e.g 'I'\\''m Groot' (or double-quote if possible: "I'm Groot").

2. **Load ADK agent design documents**: Read from FEATURE_DIR:
   - **Required**: plan.md (ADK architecture, agent types, tools, state), spec.md (interaction scenarios with priorities)
   - **Optional**: agent-architecture.md (detailed agent design), tool-specifications.md (tool details), prompts/ (agent instructions), research.md (ADK patterns), quickstart.md (test scenarios)
   - Note: Not all projects have all documents. Generate tasks based on what's available.

3. **Execute ADK agent task generation workflow**:
   - Load plan.md and extract: agent type, tools, state management, deployment target
   - Load spec.md and extract: interaction scenarios with priorities (P1, P2, P3, etc.)
   - If agent-architecture.md exists: Extract sub-agent hierarchy and communication patterns
   - If tool-specifications.md exists: Map tools to interaction scenarios
   - If prompts/ exists: Extract prompt requirements per agent
   - If research.md exists: Extract ADK pattern decisions for setup tasks
   - Generate tasks organized by interaction scenario (see ADK Task Generation Rules below)
   - Generate dependency graph showing scenario completion order
   - Create parallel execution examples per scenario
   - Validate task completeness (each scenario has all needed tasks, independently testable)

4. **Generate tasks.md**: Use `.specify/templates/tasks-template.md` as structure, fill with:
   - Correct agent name from plan.md
   - Phase 1: ADK Project Setup tasks (project initialization, dependencies)
   - Phase 2: Foundational Agent Components (blocking prerequisites for all scenarios)
   - Phase 3+: One phase per interaction scenario (in priority order from spec.md)
   - Each phase includes: scenario goal, independent test criteria, evaluation tests (if requested), implementation tasks
   - Final Phase: Agent Polish & cross-cutting concerns (observability, deployment)
   - All tasks must follow the strict checklist format (see Task Generation Rules below)
   - Clear file paths for each task (`<agent_package_name>/agent.py`, `<agent_package_name>/prompt.py`, `<agent_package_name>/tools/`, `<agent_package_name>/sub_agents/`)
   - Dependencies section showing scenario completion order
   - Parallel execution examples per scenario
   - Implementation strategy section (MVP first, incremental delivery)

5. **Report**: Output path to generated tasks.md and summary:
   - Total task count
   - Task count per interaction scenario
   - Parallel opportunities identified
   - Independent test criteria for each scenario
   - Suggested MVP scope (typically just Scenario 1)
   - Format validation: Confirm ALL tasks follow the checklist format (checkbox, ID, labels, file paths)

Context for task generation: {{args}}

The tasks.md should be immediately executable - each task must be specific enough that an LLM can complete it without additional context.

## ADK Agent Task Generation Rules

**CRITICAL**: Tasks MUST be organized by interaction scenario to enable independent implementation and testing.

**Evaluation Tests are OPTIONAL**: Only generate evaluation test tasks if explicitly requested in the feature specification or if user requests evaluation-driven approach.

### Checklist Format (REQUIRED)

Every task MUST strictly follow this format:

```text
- [ ] [TaskID] [P?] [Scenario?] Description with file path
```

**Format Components**:

1. **Checkbox**: ALWAYS start with `- [ ]` (markdown checkbox)
2. **Task ID**: Sequential number (T001, T002, T003...) in execution order
3. **[P] marker**: Include ONLY if task is parallelizable (different files, no dependencies on incomplete tasks)
4. **[Scenario] label**: REQUIRED for interaction scenario phase tasks only
   - Format: [S1], [S2], [S3], etc. (maps to interaction scenarios from spec.md)
   - Setup phase: NO scenario label
   - Foundational phase: NO scenario label  
   - Interaction Scenario phases: MUST have scenario label
   - Polish phase: NO scenario label
5. **Description**: Clear action with exact file path

**ADK-Specific Examples**:

- ✅ CORRECT: `- [ ] T001 Create ADK agent package structure per implementation plan in <agent_package_name>/`
- ✅ CORRECT: `- [ ] T005 [P] Define LLM model configuration in <agent_package_name>/config.py`
- ✅ CORRECT: `- [ ] T012 [P] [S1] Create FunctionTool for search in <agent_package_name>/tools/search_tool.py`
- ✅ CORRECT: `- [ ] T014 [S1] Write agent instruction in <agent_package_name>/prompt.py`
- ✅ CORRECT: `- [ ] T020 [S1] Integrate search tool into agent in <agent_package_name>/agent.py`
- ❌ WRONG: `- [ ] Create search tool` (missing ID and Scenario label)
- ❌ WRONG: `T001 [S1] Create tool` (missing checkbox)
- ❌ WRONG: `- [ ] [S1] Create search tool` (missing Task ID)
- ❌ WRONG: `- [ ] T001 [S1] Create tool` (missing file path)

### ADK Agent Task Organization

1. **From Interaction Scenarios (spec.md)** - PRIMARY ORGANIZATION:
   - Each interaction scenario (P1, P2, P3...) gets its own phase
   - Map all related components to their scenario:
     - Tools needed for that scenario
     - Sub-agents needed for that scenario (if multi-agent)
     - Prompts needed for that scenario
     - State keys needed for that scenario
     - If evaluation requested: Evaluation tests specific to that scenario
   - Mark scenario dependencies (most scenarios should be independent)

2. **From Tool Specifications**:
   - Map each tool → to the interaction scenario it serves
   - If evaluation requested: Each tool → unit test task [P] before implementation in that scenario's phase
   - Tool docstring → critical task (LLM reads this!)

3. **From Agent Architecture**:
   - Map each sub-agent to the interaction scenario(ies) that need it
   - If sub-agent serves multiple scenarios: Put in earliest scenario or Foundational phase
   - Agent orchestration → tasks in appropriate scenario phase

4. **From Setup/Infrastructure**:
   - Shared infrastructure → Setup phase (Phase 1): ADK installation, project structure, .env.example
   - Foundational/blocking tasks → Foundational phase (Phase 2): Base agent, state management, logging
   - Scenario-specific setup → within that scenario's phase

### ADK Phase Structure

- **Phase 1**: ADK Project Setup (project initialization, dependencies, config)
- **Phase 2**: Foundational Agent Components (blocking prerequisites - MUST complete before scenarios)
  - Base agent structure
  - State management setup
  - Logging configuration
  - Shared utilities
- **Phase 3+**: Interaction Scenarios in priority order (P1, P2, P3...)
  - Within each scenario: Evaluation tests (if requested) → Tools → Prompts → Agent integration → Testing with `adk run`
  - Each phase should be a complete, independently testable increment
- **Final Phase**: Agent Polish & Cross-Cutting Concerns
  - Observability (OpenTelemetry, BigQuery Analytics)
  - Performance optimization
  - Deployment scripts
  - Documentation

### ADK-Specific Task Types

**Tool Implementation Tasks**:
- Create FunctionTool with type hints
- Write descriptive docstring (CRITICAL - LLM reads this!)
- Implement error handling (return errors, don't raise)
- Add confirmation for destructive operations
- Write tool unit tests (if evaluation requested)

**Prompt Engineering Tasks**:
- Define agent persona and role
- Write clear task descriptions
- Specify tool usage guidelines
- Define output format requirements
- Add error handling instructions
- Document state management instructions

**Agent Integration Tasks**:
- Create LlmAgent/SequentialAgent/ParallelAgent/LoopAgent
- Integrate tools with agent
- Configure state management (output_key)
- Set up sub-agents (if multi-agent)
- Configure callbacks (if needed)

**State Management Tasks**:
- Define state keys (unique, descriptive names)
- Document state flow between agents
- Implement state persistence (if needed)
- Configure session management

**Evaluation Tasks** (if requested):
- Write AgentEvaluator tests for scenarios
- Define evaluation metrics
- Create test datasets
- Run evaluation with pytest

**Deployment Tasks**:
- Configure deployment target (Cloud Run, Agent Engine, GKE)
- Set up environment variables
- Configure observability (tracing, logging)
- Write deployment scripts
- Create README with usage instructions
"""
