## ADK-Specific Planning Guidelines

### Agent Type Selection

**LlmAgent** - Choose when:
- Need intelligent reasoning and dynamic tool selection
- Conversational interactions with users
- Complex decision-making based on context
- Single agent can handle all scenarios

**SequentialAgent** - Choose when:
- Tasks must execute in specific order
- Each step depends on previous results
- Clear pipeline structure (A → B → C)
- State passing between phases

**ParallelAgent** - Choose when:
- Tasks are independent
- Performance is critical
- Gathering from multiple sources
- No dependencies between sub-agents

**LoopAgent** - Choose when:
- Iterative improvement needed
- Quality threshold to meet
- Retry with refinement
- Termination condition exists

**Multi-Agent System** - Choose when:
- Complex task requiring specialization
- Different expertise domains
- Sub-agents have distinct responsibilities
- Orchestrator coordinates specialists

### Tool Design Principles

**Every tool MUST have**:
- Clear, descriptive docstring (LLM reads this!)
- Type hints for all parameters
- Documented return value
- Error handling (return errors, don't raise)
- Test scenarios

**Tool Confirmation**:
- Require confirmation for destructive operations
- Require confirmation for external actions (email, API posts)
- Require confirmation for financial transactions
- Use `require_confirmation=True` in FunctionTool

### State Management Planning

**Define state keys**:
- Use unique, descriptive names (e.g., `user_preferences`, not `data`)
- Document what each key contains
- Plan state flow between agents
- Use `output_key` to save agent results

**State flow example**:
```
Agent A (output_key="analysis") → state["analysis"] → 
Agent B (instruction="Process {analysis}") → state["result"]
```

### Prompt Engineering Strategy

**Effective prompts include**:
- Clear agent persona ("You are a financial advisor...")
- Specific task description
- Tool usage guidelines ("Use the search tool when...")
- Output format requirements
- Examples of good responses
- Error handling instructions

**Avoid**:
- Vague instructions ("You are a helpful assistant")
- Ambiguous goals
- Missing tool guidance
- No error handling instructions

## Constitution Check (ADK-Specific)

Validate against ADK constitution principles:

1. **Single Responsibility**: Each agent has one clear purpose
2. **Tool Documentation**: All tools have descriptive docstrings
3. **State Management**: Unique, descriptive state keys
4. **Test-First**: Plan includes evaluation strategy
5. **Observability**: Tracing and logging planned
6. **Performance**: Appropriate agent types and models chosen
7. **Error Handling**: Graceful degradation planned

**If violations exist**:
- Document in "Complexity Tracking" section
- Provide justification
- Explain why simpler alternatives don't work

## Key Rules

- Use absolute paths
- ERROR on gate failures or unresolved clarifications
- All tools must have docstrings
- State keys must be unique and descriptive
- Choose appropriate agent type for the task
- Plan for observability from the start
- Consider cost (flash vs pro) vs capability needs
