description = "Convert existing ADK agent tasks into actionable, dependency-ordered GitHub issues for the feature based on available design artifacts."

prompt = """
---
description: Convert existing ADK agent tasks into actionable, dependency-ordered GitHub issues for the feature based on available design artifacts.
tools: ['github/github-mcp-server/issue_write']
---

## User Input

```text
$ARGUMENTS
```

You **MUST** consider the user input before proceeding (if not empty).

## Outline

1. Run `.specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks` from repo root and parse FEATURE_DIR and AVAILABLE_DOCS list. All paths must be absolute. For single quotes in args like "I'm Groot", use escape syntax: e.g 'I'\\''m Groot' (or double-quote if possible: "I'm Groot").
1. From the executed script, extract the path to **tasks**.
1. Get the Git remote by running:

```bash
git config --get remote.origin.url
```

> [!CAUTION]
> ONLY PROCEED TO NEXT STEPS IF THE REMOTE IS A GITHUB URL

1. For each ADK agent task in the list, use the GitHub MCP server to create a new issue in the repository that is representative of the Git remote.

**ADK-Specific Issue Formatting**:
- Title: Use task description with [ADK Agent] prefix
- Labels: Add appropriate labels (adk-agent, tool-implementation, prompt-engineering, evaluation, etc.)
- Body: Include:
  - Task description with file paths
  - Scenario label (S1, S2, etc.) if applicable
  - Dependencies (sequential tasks that must complete first)
  - ADK-specific context (agent type, tools involved, state keys)
  - Acceptance criteria (how to verify completion)
  - Testing instructions (e.g., "Test with `adk run [agent_name]`")

**Issue Organization**:
- Create milestone for each interaction scenario (S1, S2, S3)
- Link dependent issues
- Mark parallel tasks with "can-parallelize" label

> [!CAUTION]
> UNDER NO CIRCUMSTANCES EVER CREATE ISSUES IN REPOSITORIES THAT DO NOT MATCH THE REMOTE URL
"""
